<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>6月の琵琶湖湖岸 — ビワヨシノボリ</title><link rel="stylesheet" href="style.css?v=mobile2"></head><body>
<main><header><div class="bgm-controls" role="group" aria-label="BGMの操作"><label for="bgmSelect">BGM</label><select id="bgmSelect" aria-label="BGMを選ぶ"></select><button id="bgmToggle" type="button" aria-pressed="false">再生</button><label for="bgmVolume" class="volume-label">音量</label><input id="bgmVolume" type="range" min="0" max="100" value="25" aria-label="BGMの音量"><span id="bgmStatus" role="status" aria-live="polite"></span></div><nav aria-label="操作モード"><button id="viewMode" class="active">眺める</button><button id="editMode">配置を変更</button></nav></header>
<section id="stage" aria-label="ビワヨシノボリの3D水槽"><canvas id="scene" aria-label="ドラッグで回転、スクロールで拡大する3D水槽"></canvas><div id="loading">水槽を準備しています<span></span></div><div id="notice" role="status"></div><div class="view-tools"><button id="maleFocus">♂を近くで見る</button><button id="femaleFocus">♀を近くで見る</button><button id="home">視点を戻す</button><button id="top">上から見る</button><button id="front">正面から見る</button></div><div id="hint">ドラッグで回転・スクロールで拡大</div></section>
<aside id="editor" hidden><div class="aside-heading"><span>LAYOUT</span><h2>配置を変更</h2></div><label>対象<select id="objectSelect"></select></label><p class="help">石・小枝・落ち葉を選び、底面上でドラッグできます。</p>
<label>左右 <output id="xVal"></output><input id="posX" type="range" min="-27" max="27" step="0.1"></label><label>高さ <output id="yVal"></output><input id="posY" type="range" min="0" max="18" step="0.1"></label><label>前後 <output id="zVal"></output><input id="posZ" type="range" min="-17" max="17" step="0.1"></label><label>向き <output id="rotVal"></output><input id="rotY" type="range" min="-180" max="180" step="1"></label>
<div id="stoneControls"><label>この石の色<select id="stoneColor"><option value="olive-gray">灰緑色</option><option value="warm-brown">褐色</option><option value="neutral-gray">灰色</option></select></label><label>石をまとめて配色<select id="allColor"><option value="">色を選択</option><option value="olive-gray">灰緑色にそろえる</option><option value="warm-brown">褐色にそろえる</option><option value="neutral-gray">灰色にそろえる</option></select></label></div>
<button id="restore" class="restore">デフォルトに戻す</button><p class="save-note">変更はこのブラウザーに自動保存されます。</p></aside>
</main><audio id="bgmAudio" preload="none" loop></audio><script defer src="bgm-tracks.js?v=mobile2"></script><script defer src="bgm.js?v=mobile2"></script><script defer src="assets-data.js?v=mobile2"></script><script defer src="aquarium.js?v=mobile2"></script></body></html>

<title>ルリヨシノボリの水槽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: the bright riffle tank fills the screen; title top-left, controls along the bottom edge, the layout
   editor opens as a sheet above them. The water stays daylight-bright; the controls follow light / dark tokens. */
:root{
  --water:#cfe7e9; --water-2:#e8f4f3;
  --ink:#16323a; --ink-soft:#4b6870; --accent:#1f6f9a; --line:#b9d0d4; --chip:#f4fafa; --sheet:#f6fbfb;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e3f0f1;--ink-soft:#a9c3c7;--accent:#7cc3e6;--line:#2f4b52;--chip:#13262b;--sheet:#102127;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e3f0f1;--ink-soft:#a9c3c7;--accent:#7cc3e6;--line:#2f4b52;--chip:#13262b;--sheet:#102127;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--water);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;background:linear-gradient(var(--water-2),var(--water))}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:grid;gap:2px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,4.6vw,28px);letter-spacing:.08em;margin:0;color:#10303a;text-wrap:balance;text-shadow:0 1px 8px rgba(255,255,255,.6)}
.hint{margin:0;color:#2c4d55;font-size:12.5px;line-height:1.6;text-shadow:0 1px 6px rgba(255,255,255,.7)}
body[data-mode="edit"] .hint-view,body[data-mode="view"] .hint-edit{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
button,select{font:500 14px var(--body);color:var(--ink);background:color-mix(in srgb,var(--chip) 84%,transparent);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--chip))}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;gap:0}
.seg button:first-child{border-radius:999px 0 0 999px}.seg button:last-child{border-radius:0 999px 999px 0;border-left:0}
#edit-panel{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.sheet{pointer-events:auto;width:min(560px,100%);max-height:46vh;overflow:auto;background:color-mix(in srgb,var(--sheet) 94%,transparent);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > label{font-size:13px;opacity:.85;min-width:4.5em}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.note{margin:0;font-size:12px;opacity:.8;line-height:1.6}
#status{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center}
#status div{display:grid;gap:10px;justify-items:center;max-width:30em}
#status p{margin:0;color:#2c4d55;font-size:14px;line-height:1.7}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink)}
#info{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 32px));background:color-mix(in srgb,var(--sheet) 90%,transparent);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#info p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-soft)}
#info .info-name{display:grid;gap:0}
#info-name{font-family:var(--display);font-size:18px;color:var(--ink)}
#info-sci{font-style:italic;font-size:12px}
@media (max-width:600px){#info{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));right:16px;padding:10px 12px;gap:6px}
  #info-name{font-size:16px}
  #info-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  #info.open #info-text{display:block}
  #info button{min-height:34px;padding:5px 12px;font-size:13px}}
body[data-mode="edit"] #info{display:none}
.q{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.q select{min-height:32px;padding:4px 10px;font-size:12px}
</style>
<div id="stage">
  <canvas id="view" aria-label="ルリヨシノボリの水槽：上流の瀬の砂底に青黒い角石が並び、ルリヨシノボリ1匹が石の上で止まっては短く泳ぐ3D水槽"></canvas>
  <header>
    <h1>ルリヨシノボリの水槽</h1>
    <p class="hint hint-view">上流の瀬の川底。1本指（ドラッグ）で回転、2本指（ホイール）で拡大。</p>
    <p class="hint hint-edit">石をタップして選び、ドラッグで動かせます。下の欄でも調整できます。</p>
  </header>
  <div id="toast" role="status" hidden></div>
  <aside id="info" hidden aria-live="polite">
    <p class="info-name"><span id="info-name"></span><span id="info-sci"></span></p>
    <p id="info-text"></p>
    <div class="row"><button type="button" id="info-close">全体を見る</button></div>
  </aside>
  <div id="edit-panel" hidden>
    <div class="sheet">
      <div class="row"><label for="obj-select">選択</label><select id="obj-select"><option value="">（なし）</option></select></div>
      <div id="obj-controls" hidden style="display:grid;gap:10px">
        <div class="row"><label for="pos-x">左右（cm）</label><input id="pos-x" type="range" min="-30" max="30" step="0.5"></div>
        <div class="row"><label for="pos-z">前後（cm）</label><input id="pos-z" type="range" min="-15" max="15" step="0.5"></div>
        <div class="row"><label for="rot-y">向き（度）</label><input id="rot-y" type="range" min="-180" max="180" step="1"></div>
        <div class="row" id="stone-color"><label>この石の色</label><button type="button" data-color="blueblack">青黒</button><button type="button" data-color="greyblack">灰黒</button></div>
      </div>
      <div class="row"><label>石をすべて</label><button type="button" data-all-color="blueblack">青黒にする</button><button type="button" data-all-color="greyblack">灰黒にする</button></div>
      <div class="row"><button type="button" id="reset">デフォルトに戻す</button></div>
      <p class="note">配置と色はこのブラウザに保存され、次に開いたときに続きから表示されます。「デフォルトに戻す」で承認した配置と色に戻ります。</p>
    </div>
  </div>
  <div class="bar">
    <span class="seg"><button type="button" id="mode-view" aria-pressed="true">眺める</button><button type="button" id="mode-edit" aria-pressed="false">配置を変更</button></span>
    <button type="button" data-view="front">正面</button>
    <button type="button" data-view="oblique">斜め</button>
    <button type="button" data-view="top">上から</button>
    <button type="button" id="watch" aria-pressed="false">ルリヨシノボリを観察</button>
    <span class="q"><span id="quality-now"></span><select id="quality" aria-label="画質"><option value="auto">画質：自動</option><option value="standard">標準（反射・屈折）</option><option value="light">軽量（スマホ向け）</option></select></span>
  </div>
  <div id="status"><div><p>読み込み中…</p><button type="button" hidden>再読み込み</button></div></div>
</div>
__SCRIPTS__

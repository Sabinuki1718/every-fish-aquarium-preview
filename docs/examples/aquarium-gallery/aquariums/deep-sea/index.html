<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>深海の水槽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: the dark tank fills the screen; title top-left, controls float along the bottom edge,
   and the layout editor opens as a sheet above them. The tank itself is always deep-sea dark;
   the controls follow the light / dark theme tokens. */
:root{
  --abyss:#02060c; --abyss-2:#071425;
  --ink:#e4ebf2; --ink-soft:#9aabbb; --glow:#7fb4d8; --line:#2b3a4a; --sheet:#0d1724;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--sheet:#f2f5f8;--ink-panel:#1d2a36;--line:#c3ceda;color-scheme:light}}
:root[data-theme="light"]{--sheet:#f2f5f8;--ink-panel:#1d2a36;--line:#c3ceda;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;background:radial-gradient(110% 80% at 50% 30%,var(--abyss-2),var(--abyss) 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:grid;gap:2px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,4.6vw,28px);letter-spacing:.08em;margin:0;color:var(--ink);text-wrap:balance}
.hint{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.6}
body[data-mode="edit"] .hint-view,body[data-mode="view"] .hint-edit{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
button,select{font:500 14px var(--body);color:var(--ink);background:color-mix(in srgb,#0d1724 78%,transparent);border:1px solid #2b3a4a;border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button[aria-pressed="true"]{border-color:var(--glow);color:var(--glow);background:color-mix(in srgb,var(--glow) 14%,#0d1724)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.seg{display:inline-flex;gap:0}
.seg button:first-child{border-radius:999px 0 0 999px}.seg button:last-child{border-radius:0 999px 999px 0;border-left:0}
#edit-panel{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.sheet{pointer-events:auto;width:min(560px,100%);max-height:46vh;overflow:auto;background:color-mix(in srgb,var(--sheet) 94%,transparent);color:var(--ink-panel,var(--ink));border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet button,.sheet select{color:var(--ink-panel,var(--ink));background:color-mix(in srgb,var(--sheet) 80%,transparent);border-color:var(--line)}
.sheet button[aria-pressed="true"]{border-color:var(--glow);color:var(--glow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > label{font-size:13px;opacity:.8;min-width:4.5em}
input[type=range]{flex:1;min-width:0;accent-color:var(--glow)}
.note{margin:0;font-size:12px;opacity:.75;line-height:1.6}
#status{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center}
#status[hidden]{display:none}
#status div{display:grid;gap:10px;justify-items:center;max-width:30em}
#status p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.7}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#0d1724;border:1px solid #2b3a4a;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink)}
#toast[hidden]{display:none}
#info{position:absolute;top:calc(84px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 32px));background:color-mix(in srgb,#0d1724 86%,transparent);border:1px solid #2b3a4a;border-radius:14px;padding:12px 14px;display:grid;gap:8px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#info p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-soft)}
#info .info-name{display:grid;gap:0}
#info-name{font-family:var(--display);font-size:18px;color:var(--ink)}
#info-sci{font-style:italic;font-size:12px}
@media (max-width:600px){#info{top:auto;bottom:calc(196px + env(safe-area-inset-bottom,0px));right:16px;padding:10px 12px;gap:6px}
  #info-name{font-size:16px}
  #info button{min-height:34px;padding:5px 12px;font-size:13px}}
body[data-mode="edit"] #info{display:none}
.bgm{display:inline-flex;align-items:center;gap:6px}
.bgm input{width:80px;accent-color:var(--glow)}
.q{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.q select{min-height:32px;padding:4px 10px;font-size:12px}
</style>
<div id="stage">
  <canvas id="view" aria-label="深海の水槽：リュウグウノツカイ、オトヒメコンニャクウオ、ミズウオ、メヒカリ10匹が泳ぐ3D水槽"></canvas>
  <header>
    <h1>深海の水槽</h1>
    <p class="hint hint-view">リュウグウノツカイ・オトヒメコンニャクウオ・ミズウオ・メヒカリ。1本指（ドラッグ）で回転、2本指（ホイール）で拡大。</p>
    <p class="hint hint-edit">岩をタップして選び、ドラッグで動かせます。下の欄でも調整できます。</p>
  </header>
  <div id="toast" role="status" hidden></div>
  <aside id="info" hidden aria-live="polite">
    <p class="info-name"><span id="info-name"></span><span id="info-sci"></span></p>
    <div class="row"><button type="button" id="info-next" hidden>次のメヒカリ</button><button type="button" id="info-close">全体を見る</button></div>
  </aside>
  <div id="edit-panel" hidden>
    <div class="sheet">
      <div class="row"><label for="obj-select">選択</label><select id="obj-select"><option value="">（なし）</option></select></div>
      <div id="obj-controls" hidden style="display:grid;gap:10px">
        <div class="row"><label for="pos-x">左右（cm）</label><input id="pos-x" type="range" min="-100" max="100" step="1"></div>
        <div class="row"><label for="pos-z">前後（cm）</label><input id="pos-z" type="range" min="-45" max="45" step="1"></div>
        <div class="row"><label for="rot-y">向き（度）</label><input id="rot-y" type="range" min="-180" max="180" step="1"></div>
        <div class="row" id="stone-color"><label>この岩の色</label><button type="button" data-color="dark">灰色</button><button type="button" data-color="red">赤茶</button></div>
      </div>
      <div class="row"><label>岩をすべて</label><button type="button" data-all-color="dark">灰色にする</button><button type="button" data-all-color="red">赤茶にする</button></div>
      <div class="row"><button type="button" id="reset">デフォルトに戻す</button></div>
      <p class="note">配置と色はこのブラウザに保存され、次に開いたときに続きから表示されます。「デフォルトに戻す」で承認した配置と色に戻ります。</p>
    </div>
  </div>
  <div class="bar">
    <span class="seg"><button type="button" id="mode-view" aria-pressed="true">眺める</button><button type="button" id="mode-edit" aria-pressed="false">配置を変更</button></span>
    <button type="button" data-view="front">正面</button>
    <button type="button" data-view="oblique">斜め</button>
    <button type="button" data-view="top">上から</button>
    <select id="watch" aria-label="観察する魚"><option value="">魚を観察…</option><option value="oarfish">リュウグウノツカイ</option><option value="otohime">オトヒメコンニャクウオ</option><option value="mehikari">メヒカリ</option><option value="mizuuo">ミズウオ</option></select>
    <span class="bgm"><button type="button" id="bgm" aria-pressed="false">BGM：オフ</button><input id="bgm-vol" type="range" min="0" max="1" step="0.05" value="0.45" aria-label="BGMの音量"></span>
    <span class="q"><span id="quality-now"></span><select id="quality" aria-label="画質"><option value="auto">画質：自動</option><option value="standard">標準（反射・屈折）</option><option value="light">軽量（スマホ向け）</option></select></span>
  </div>
  <div id="status"><div><p>読み込み中…</p><button type="button" hidden>再読み込み</button></div></div>
</div>

rock with the user-supplied texture (grey granular stone, olive algae, small barnacles)", "pos": [18, 0, 12], "size": [12, 7, 10], "rot_deg": 0, "color": "dark", "texture": "aquarium/textures/source/rock-user-01.png"}], "stone_colors": {"dark": "the user texture as is (grey with olive)", "red": "the same texture tinted rust-brown (iron-stained) — second colour option"}, "assumptions": ["tank size 200×90×150 cm (water 145 cm) is an assumption so the 1 m oarfish fits upright", "habitats are combined into one virtual deep-sea tank (user: 同居、立ち泳ぎ)", "this render is a blocking draft with the approved fish models; rocks and sea life are simple shapes", "rocks only, no sea pens or soft corals (user: 石以外何も入れないほうが良さそう)", "rock texture supplied by the user (aquarium/textures/source/rock-user-01.png); the red-brown option is a tint of it", "mizuuo (Alepisaurus ferox) 60 cm added to the mid-water on a stadium-shaped loop (straights of 40 cm + half circles of radius 24 cm) centred 35 cm right of centre, 67-83 cm above the floor (bob ±8 cm); checked: whole body within x -0.21..0.93 m, z ±0.38 m (glass at ±1.0 / ±0.45), at least ~16 cm from the oarfish column"]}, "models": {"species/alepisaurus-ferox/model/v2/mizuuo.glb": {"geometry": "models/mizuuo.json", "standard": "models/mizuuo-2048.jpg", "light": "models/mizuuo-1024.jpg"}, "species/careproctus-shigemii/model/v5/otohime.glb": {"geometry": "models/otohime.json", "standard": "models/otohime-2048.jpg", "light": "models/otohime-1024.jpg"}, "species/chlorophthalmus-borealis/model/v3/mehikari.glb": {"geometry": "models/mehikari.json", "standard": "models/mehikari-2048.jpg", "light": "models/mehikari-1024.jpg"}, "species/regalecus-russelii/model/v1/oarfish.glb": {"geometry": "models/oarfish.json", "standard": "models/oarfish-2048.jpg", "light": "models/oarfish-1024.jpg"}}, "textures": {"sand": "textures/sand.jpg", "rock-dark": "textures/rock-dark.jpg", "rock-red": "textures/rock-red.jpg"}, "bgm": "audio/bgm.mp3"};</script>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>青色金魚絵巻</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap">
<style>
/* Layout: one sheet of washi filling the screen (the nihonga shader paints the paper); the title sits top-left like a
   scroll's inscription, controls float along the bottom edge; editor and fish notes open as small sheets above them.
   Single look by design: the paper and sumi stay the same in light and dark themes. */
:root{
  --paper:#ded1b0; --paper-2:#d3c49f; --sheet:#f1e9d6; --ink:#26262d; --ink-soft:#5f5b55; --ai:#3e5a73; --line:#c9bea6;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);overflow:hidden}
#stage{position:relative;height:100%;background:var(--paper)}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:grid;gap:2px}
h1{font-weight:600;font-size:clamp(20px,4.6vw,28px);letter-spacing:.12em;margin:0;text-wrap:balance}
.hint{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.7}
body[data-mode="edit"] .hint-view,body[data-mode="view"] .hint-edit{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
button,select{font:500 14px var(--display);color:var(--ink);background:color-mix(in srgb,var(--sheet) 88%,transparent);border:1px solid var(--line);border-radius:3px;padding:7px 13px;min-height:40px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);background:color-mix(in srgb,var(--ai) 10%,var(--sheet))}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.seg{display:inline-flex}
.seg button:first-child{border-radius:3px 0 0 3px}.seg button:last-child{border-radius:0 3px 3px 0;border-left:0}
.panel{position:absolute;left:0;right:0;bottom:calc(var(--bar-h,66px) + 6px);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.sheet{pointer-events:auto;width:min(560px,100%);max-height:min(46vh,calc(100% - var(--bar-h,66px) - 120px));overflow:auto;background:color-mix(in srgb,var(--sheet) 95%,transparent);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 1px 0 var(--paper-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > label{font-size:13px;color:var(--ink-soft);min-width:5em}
input[type=range]{flex:1;min-width:0;accent-color:var(--ai)}
.note{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.7}
#watch-panel .sheet{width:min(440px,100%)}
#watch-panel h2{margin:0;font-size:18px;font-weight:600;letter-spacing:.08em}
#watch-panel .sci{margin:0;font-size:13px;color:var(--ink-soft);font-style:italic}
#watch-panel p.body{margin:0;font-size:13.5px;line-height:1.8}
#watch-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#status{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center}
#status div{display:grid;gap:10px;justify-items:center;max-width:30em}
#status p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.7}
#toast{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:6px 14px;font-size:13px}
.q{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.q select{min-height:34px;padding:4px 8px;font-size:12px}
@media (max-width:520px){#watch-panel p.body{font-size:12.5px;line-height:1.7}#watch-panel .sheet{padding:10px 12px;gap:6px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<div id="stage">
  <canvas id="view" aria-label="青色金魚絵巻：枯山水の石組とカボンバの間を青文魚・穂竜・銀水泡眼が泳ぐ、日本画で描いた3D水槽"></canvas>
  <header>
    <h1>青色金魚絵巻</h1>
    <p class="hint hint-view">1本指（ドラッグ）で回転、2本指（ホイール）で拡大。魚をタップすると近くで観察できます。</p>
    <p class="hint hint-edit">石や水草の株をタップして選び、ドラッグで動かせます。下の欄でも調整できます。</p>
  </header>
  <div id="toast" role="status" hidden></div>
  <div id="edit-panel" class="panel" hidden>
    <div class="sheet">
      <div class="row"><label for="obj-select">選択</label><select id="obj-select"><option value="">（なし）</option></select></div>
      <div id="obj-controls" hidden style="display:grid;gap:10px">
        <div class="row"><label for="pos-x">左右（cm）</label><input id="pos-x" type="range" min="-27" max="27" step="0.5"></div>
        <div class="row"><label for="pos-z">前後（cm）</label><input id="pos-z" type="range" min="-13" max="13" step="0.5"></div>
        <div class="row"><label for="rot-y">向き（度）</label><input id="rot-y" type="range" min="-180" max="180" step="1"></div>
        <div class="row" id="stone-color"><label>この石の色</label><button type="button" data-color="ai">藍鼠</button><button type="button" data-color="midori">苔緑</button></div>
      </div>
      <div class="row"><label>石をすべて</label><button type="button" data-all-color="ai">藍鼠にする</button><button type="button" data-all-color="midori">苔緑にする</button></div>
      <div class="row"><button type="button" id="reset">デフォルトに戻す</button></div>
      <p class="note">配置と色はこのブラウザに保存され、次に開いたときに続きから表示されます。「デフォルトに戻す」で承認した配置と色に戻ります。砂紋は石の位置に合わせて引き直されます。</p>
    </div>
  </div>
  <div id="watch-panel" class="panel" hidden>
    <div class="sheet" role="dialog" aria-labelledby="watch-name">
      <h2 id="watch-name"></h2>
      <p class="sci" id="watch-sci"></p>
      <p class="body" id="watch-body"></p>
      <div id="watch-bar"><button type="button" id="watch-stop" aria-pressed="false">止める</button><button type="button" id="watch-next">次の魚</button><button type="button" id="watch-all">全体へ</button><button type="button" id="watch-close">説明を閉じる</button></div>
    </div>
  </div>
  <div class="bar">
    <span class="seg"><button type="button" id="mode-view" aria-pressed="true">眺める</button><button type="button" id="mode-edit" aria-pressed="false">配置を変更</button></span>
    <button type="button" data-view="front">正面</button>
    <button type="button" data-view="oblique">斜め</button>
    <button type="button" data-view="top">上から</button>
    <button type="button" id="bgm" aria-pressed="false" hidden>BGM</button>
    <select id="watch-select" aria-label="観察する魚"><option value="">観察：全体を見る</option></select>
    <span class="q"><select id="quality" aria-label="画質"><option value="auto">画質：自動</option><option value="standard">標準</option><option value="light">軽量（スマホ向け）</option></select></span>
  </div>
  <div id="status"><div><p>読み込み中…</p><button type="button" hidden>再読み込み</button></div></div>
</div>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9eeec"><title>ダンゴウオとホンダワラの磯</title><link rel="stylesheet" href="./style.css"></head><body>
<header><select id="quality-select" aria-label="画質"><option value="auto">画質：自動</option><option value="light">画質：軽量</option><option value="standard">画質：標準</option></select><nav aria-label="表示モード"><button id="view-mode" class="active" aria-pressed="true">眺める</button><button id="edit-mode" aria-pressed="false">配置を変更</button></nav></header>
<main><section id="stage" aria-label="3D水槽"><canvas id="aquarium" aria-label="ドラッグで回転、ホイールまたはピンチで拡大できる3D水槽"></canvas><div id="loading" role="status">磯の水槽を準備しています<span>3匹のモデルと素材を読み込み中</span></div><div class="view-tools"><button id="home">視点を戻す</button><button id="top">上から見る</button></div><div class="hint">ドラッグで回転 · ホイール / ピンチで拡大</div><div id="toast" role="status" aria-live="polite"></div></section>
<aside id="editor" hidden><div class="panel-heading"><h2>配置を変更</h2><span>つかんで移動できます</span></div><label>選択する素材<select id="object-select"></select></label><div id="position-controls"><label>左右 <output id="x-value"></output><input id="pos-x" type="range" min="-15" max="15" step=".1"></label><label>高さ <output id="y-value"></output><input id="pos-y" type="range" min="0" max="19" step=".1"></label><label>前後 <output id="z-value"></output><input id="pos-z" type="range" min="-9" max="9" step=".1"></label><label>向き <output id="rot-value"></output><input id="rotation" type="range" min="-180" max="180" step="1"></label></div><div id="stone-controls"><h3>この石の色</h3><div class="colors" id="individual-colors"><button data-color="charcoal"><i class="charcoal"></i>黒</button><button data-color="blueblack"><i class="blueblack"></i>青黒</button></div><h3>すべての石の色</h3><div class="colors" id="all-colors"><button data-color="charcoal">すべて黒</button><button data-color="blueblack">すべて青黒</button></div></div><button id="restore" class="restore">デフォルトに戻す</button><p class="save-note">配置と石の色は、このブラウザーに自動保存されます。</p></aside></main>
<footer><div class="bgm" aria-label="BGM"><span>BGM</span><div class="bgm-tracks"><button data-bgm="1" aria-label="BGM 1" aria-pressed="true">1</button><button data-bgm="2" aria-label="BGM 2" aria-pressed="false">2</button><button data-bgm="3" aria-label="BGM 3" aria-pressed="false">3</button></div><button id="bgm-toggle" aria-pressed="false">再生</button><label class="volume">音量<input id="bgm-volume" aria-label="BGMの音量" type="range" min="0" max="100" value="35" step="1"></label><audio id="bgm-audio" loop preload="none"></audio></div></footer><script type="module" src="./boot.js"></script></body></html>

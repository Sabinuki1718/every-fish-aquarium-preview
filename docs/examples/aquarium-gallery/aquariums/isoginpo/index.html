<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101917"><title>イソギンポの水景</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><main>
<section id="viewer" aria-label="回転・拡大できる3D水槽"><div id="canvas"></div><div id="loading" role="status">読み込み中…</div><div class="view-buttons" aria-label="視点"><button data-view="front">正面</button><button data-view="angle" class="active">斜め</button><button data-view="top">上から</button><button id="reset">視点を戻す</button><button id="fullscreen">全画面</button></div><p id="hint">ドラッグで回転 · ホイール / ピンチで拡大</p></section>
<section class="toolbar"><div class="modes" role="group" aria-label="操作モード"><button id="observe" class="active" aria-pressed="true">眺める</button><button id="edit" aria-pressed="false">配置を変更</button></div><div class="bgm" role="group" aria-label="BGM"><select id="bgm-track" aria-label="BGMの選択"><option value="0">BGM1</option><option value="1">BGM2</option><option value="2">BGM3</option></select><button id="bgm-toggle" aria-pressed="false">再生</button><label class="bgm-volume-label">音量<input id="bgm-volume" aria-label="BGMの音量" type="range" min="0" max="100" step="1" value="12"></label><span id="bgm-status" role="status" aria-live="polite"></span><audio id="bgm-audio" preload="none" loop></audio></div><div id="editor-actions" hidden><div class="colors" role="group" aria-label="石の色"><span>石の色</span><button data-all-color="green" aria-pressed="false">全部黒</button><button data-all-color="red" aria-pressed="false">全部赤</button></div><button id="restore">デフォルトに戻す</button></div></section>
<section id="editor" hidden aria-label="配置の編集"><label class="object-label">対象<select id="object" aria-label="移動する石・海藻"></select></label><label id="stone-color-field">色<select id="stone-color" aria-label="選択した石の色"><option value="0">黒</option><option value="1">赤</option></select></label><label>左右<input id="position-x" type="range" min="-6" max="6" step="0.01" aria-label="左右の位置"><output id="x-value"></output></label><label>奥行<input id="position-z" type="range" min="-3" max="3" step="0.01" aria-label="奥行の位置"><output id="z-value"></output></label><label class="rotation-label">向き<input id="rotation" type="range" min="-180" max="180" step="1" aria-label="向き"><output id="rotation-value"></output></label><p id="edit-status" role="status" aria-live="polite">石や海藻をドラッグして移動</p></section>
</main><script src="boot.js" defer></script><script type="module" src="bgm.js"></script></body></html>

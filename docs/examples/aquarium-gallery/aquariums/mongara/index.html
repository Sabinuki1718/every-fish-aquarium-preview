<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf0ef">
  <meta name="description" content="モンガラカワハギ1匹が泳ぐ、青い背景と白砂、石灰藻をまとった5個の石の3D水槽。">
  <title>モンガラカワハギの水槽</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <main id="aquarium">
  <header class="header">
   <div class="identity"><span class="eyebrow">AQUARIUM</span><h1>モンガラカワハギ</h1><p><i>Balistoides conspicillum</i><span>1匹</span></p></div>
   <div class="mode" role="group" aria-label="操作モード"><button id="watchMode" class="active" aria-pressed="true">眺める</button><button id="editMode" aria-pressed="false">配置を変更</button></div>
  </header>
  <div id="stage" aria-label="モンガラカワハギが泳ぐ3D水槽"><canvas id="canvas" aria-label="ドラッグで回転、ホイールまたはピンチで拡大"></canvas></div>
  <section id="loading" class="loading" role="status"><div class="loader"></div><p id="loadingText">水槽を準備しています…</p><button id="retry" hidden>軽量モードで開き直す</button></section>
  <aside id="editor" class="editor" hidden aria-label="石の配置を変更">
   <div class="editor-title"><h2>石の配置</h2><span>石を選んでドラッグ</span></div>
   <label>選択する石<select id="stoneSelect"></select></label>
   <div class="fields"><label>左右 <output id="xValue"></output><input id="xRange" type="range" min="-0.60" max="0.60" step="0.005" aria-label="石の左右位置"></label><label>前後 <output id="zValue"></output><input id="zRange" type="range" min="-0.20" max="0.20" step="0.005" aria-label="石の前後位置"></label><label>向き <output id="rotationValue"></output><input id="rotationRange" type="range" min="-180" max="180" step="1" aria-label="石の向き"></label></div>
   <label>この石の色<select id="stoneColor"><option value="slate-blue-gray">青灰色・石灰藻付き</option><option value="warm-beige-gray">淡い灰褐色・石灰藻付き</option></select></label>
   <label>すべての石の色<select id="allColor"><option value="">一括で変更</option><option value="slate-blue-gray">青灰色・石灰藻付き</option><option value="warm-beige-gray">淡い灰褐色・石灰藻付き</option></select></label>
   <div class="editor-foot"><button id="restore">デフォルトに戻す</button><span id="saveStatus" aria-live="polite">変更はこのブラウザに保存</span></div>
  </aside>
  <section id="swimGuide" class="swim-guide" hidden aria-label="泳ぎ方の観察">
   <div class="guide-heading"><div><span class="eyebrow">泳ぎ方を観察</span><h2>背鰭と尻鰭で泳ぐ</h2></div><button id="closeSwimGuide" aria-label="泳ぎ方の観察を終える">×</button></div>
   <p>柔らかい<strong>第2背鰭</strong>と<strong>尻鰭</strong>に、前から後ろへ波を送ります。胴体と尾を大きく振らずに進み、協調した鰭の動きで姿勢を安定させます。</p>
   <p id="swimBehavior" class="swim-behavior" aria-live="off">背鰭と尻鰭が協調して波打つ</p>
   <small>観察時はゆっくり再生。色線と光点は波の進行を示す補助表示です。振幅・周期は説明用に調整しています。<a href="https://journals.biologists.com/jeb/article/222/8/jeb194704/34045/Functional-morphology-of-endurance-swimming" target="_blank" rel="noopener">参考研究</a></small>
  </section>
  <div id="finAnnotations" hidden aria-hidden="true"><svg id="finLeaders"><path id="dorsalLeader"/><path id="analLeader"/></svg><span id="dorsalTag" class="fin-tag dorsal-tag">第2背鰭</span><span id="analTag" class="fin-tag anal-tag">尻鰭</span></div>
  <footer class="footer">
   <div class="view-controls" role="group" aria-label="視点"><button id="frontView">正面</button><button id="angleView" class="active">斜め</button><button id="topView">上から</button><span class="rule"></span><button id="followView" aria-pressed="false">魚を追う</button><button id="swimView" aria-pressed="false">泳ぎ方</button><button id="homeView" title="視点を元に戻す" aria-label="視点を元に戻す">↺</button></div>
   <div class="bottom-info"><span id="hint">ドラッグで回転 · スクロールで拡大</span><label class="quality-label">画質<select id="quality"><option value="auto">自動</option><option value="light">軽量</option><option value="standard">標準</option></select></label></div>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
 </main>
 <script src="assets/three-offline.js"></script>
 <script src="helpers.js"></script>
 <script src="swim-motion.js"></script>
 <script src="aquarium.js"></script>
</body></html>

<style>
/* Layout: the tank fills the screen; title top-left, controls float along the bottom edge,

:root{
  --paper:#f0ebe1; --paper-2:#e2dccf; --ink:#2b2a26; --ink-soft:#6a655b; --wash:#2a7f8c; --line:#d5cdbd; --sheet:#faf7f1;

}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}

h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.6vw,28px);letter-spacing:.04em;margin:0;text-wrap:balance}
.hint{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.6}

<div id="stage">
  <canvas id="view" aria-label="シマウミヘビとマアナゴの水槽：砂の底から頭を出し、這って移動する2匹の3D水槽"></canvas>
    <header>
    <h1>シマウミヘビとマアナゴの水槽</h1>
    <p class="hint hint-view">砂から頭を出す2匹を、タップするか「観察」で選ぶと近くで追いかけて見られます。1本指（ドラッグ）で回転、2本指（ホイール）で拡大。</p>

      </div>
      <div class="row"><label>石をすべて</label><button type="button" data-all-color="red">赤紫にする</button><button type="button" data-all-color="peach">桃色にする</button><button type="button" data-all-color="yellow">黄緑にする</button></div>
      <div class="row"><button type="button" id="reset">デフォルトに戻す</button></div>
      <p class="note">石の色は、白い結晶質の台の上に載った色つきの石の部分だけが変わります。配置と色はこのブラウザに保存され、次に開いたときに続きから表示されます。「デフォルトに戻す」で承認した配置と色に戻ります。</p>
    </div>
  </div>
  <div id="watch-panel" hidden>
    <div class="sheet" role="region" aria-live="polite" aria-label="観察中の魚">
      <div class="row"><span id="watch-name" hidden></span><button type="button" id="watch-hold" aria-pressed="false">止める</button><button type="button" id="watch-next">次の魚</button><button type="button" id="watch-exit">全体へ</button></div>
    </div>
  </div>
  <div class="bar">
    <span class="seg"><button type="button" id="mode-view" aria-pressed="true">眺める</button><button type="button" id="mode-edit" aria-pressed="false">配置を変更</button></span>
    <select id="watch" aria-label="1匹を選んで観察"><option value="">観察：全体を見る</option></select>
    <button type="button" data-view="front">正面</button>
    <button type="button" data-view="oblique">斜め</button>
    <button type="button" data-view="top">上から</button>
    <span class="bgm"><button type="button" id="bgm" aria-pressed="false">BGM：オフ</button><input id="bgm-vol" type="range" min="0" max="1" step="0.05" value="0.45" aria-label="BGMの音量"></span>
    <span class="q"><span id="quality-now"></span><select id="quality" aria-label="画質"><option value="auto">画質：自動</option><option value="standard">標準（水面の反射・屈折あり）</option><option value="light">軽量（スマホ向け）</option></select></span>
  </div>
  <div id="status"><div><p>読み込み中…</p><button type="button" hidden>再読み込み</button></div></div>
</div>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>魚の3Dモデル（ブラウザ簡易版）</title>
<style>
  :root { color-scheme: dark; --bg: #1c242b; --panel: rgba(20, 27, 33, 0.92); --line: #34424d; --text: #e8eef2; --muted: #9aabb7; --accent: #58b6c9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.55 system-ui, 'Hiragino Sans', 'Yu Gothic UI', 'Noto Sans JP', sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #bar { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; z-index: 2; }
  button, select { font: inherit; color: var(--text); background: #26313a; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover, button:focus-visible, select:focus-visible { border-color: var(--accent); outline: none; }
  button.on { background: #1f4652; border-color: var(--accent); }
  #panel { position: fixed; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100% - 16px)); max-height: 55%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 2; }
  #panel h1 { font-size: 16px; margin: 0; } #panel h2 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); }
  #panel i { font-weight: normal; color: var(--muted); }
  .muted { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .traits label { display: flex; gap: 6px; align-items: flex-start; margin: 3px 0; }
  #help { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 12px; z-index: 1; pointer-events: none; }
  #toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: #1f4652; padding: 6px 14px; border-radius: 8px; opacity: 0; transition: opacity .3s; z-index: 5; pointer-events: none; }
  #toast.show { opacity: 1; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); z-index: 9; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) { #help { display: none; } #panel { max-height: 40%; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="panel"></div>
<div id="help"></div>
<div id="toast"></div>
<div id="loading">読み込み中…</div>
<!-- 魚のデータ（AI が書く）。window.FISH_SPECS = [ {fish-spec}, ... ]; -->
<script src="fish-spec.js"></script>
<!-- 表示プログラム（three.js 同梱・通信不要）。このファイルはスキルの assets からコピーする -->
<script src="fish-viewer-runtime.js"></script>
</body>
</html>

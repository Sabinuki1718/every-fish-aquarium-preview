<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#38a1db">
  <title>3D水槽作例集 | every-fish-aquarium-generator</title>
  <link rel="stylesheet" href="style.css?v=20261127e">
  <script src="app.js?v=pages-20261127d" defer></script>
  <script src="underwater.js?v=20261127c" defer></script>
</head>
<body>
  <div class="water-backdrop" aria-hidden="true">
    <canvas class="water-gl"></canvas>
    <canvas class="water-bubbles"></canvas>
  </div>
  <header class="top">
    <div class="wrap top-inner">
      <a class="repo" href="https://github.com/Sabinuki1718/every-fish-aquarium-preview">GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main>
    <section class="intro">
      <div class="wrap intro-inner">
        <div>
          <h1><span class="repo-name">every-fish-aquarium-generator</span>3D水槽作例集</h1>
        </div>
        <a class="workflow" href="https://github.com/Sabinuki1718/every-fish-aquarium-preview#流れ">
          <span class="workflow-label">作例共通の制作フロー <span aria-hidden="true">↗</span></span>
          <span class="steps">魚種調査 <b>→</b> 図面 <b>→</b> 3Dモデル <b>→</b> レイアウト <b>→</b> 水槽</span>
        </a>
      </div>
    </section>
    <div class="collection-surface">
      <section class="wrap collection" aria-labelledby="gallery-title">
        <div class="toolbar">
          <h2 id="gallery-title">作例一覧 <span id="count" aria-live="polite"></span></h2>
          <label class="search"><span>絞り込み</span><input id="search" type="search" placeholder="水槽名・魚種名"></label>
        </div>
        <div id="groups"></div>
        <p id="empty" hidden>一致する作例はありません。</p>
        <noscript>一覧を表示するにはJavaScriptを有効にしてください。</noscript>
      </section>
    </div>
  </main>
</body>
</html>

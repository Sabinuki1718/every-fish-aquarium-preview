<title>金魚3匹のモデル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One full-screen stage: fish tabs top, view buttons bottom. */
:root{--paper:#eef2f3;--paper-2:#dde5e8;--ink:#1f2d38;--ink-soft:#56687a;--accent:#3f6f8c;--line:#c5d0d5;--chip:#ffffffcc;
  --body:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#141b21;--paper-2:#1f2a32;--ink:#e4e9ec;--ink-soft:#9fb0bd;--accent:#8fb6cf;--line:#34434e;--chip:#1b242bcc;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141b21;--paper-2:#1f2a32;--ink:#e4e9ec;--ink-soft:#9fb0bd;--accent:#8fb6cf;--line:#34434e;--chip:#1b242bcc;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
.stage{position:relative;height:100%;background:radial-gradient(120% 90% at 50% 45%,var(--paper) 50%,var(--paper-2))}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:12px;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:6px;pointer-events:none}
h1{font-weight:600;font-size:clamp(20px,5vw,26px);margin:0;text-wrap:balance}
.sub{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.6;max-width:36em}
.row{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
nav{position:absolute;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
button{font:500 14px var(--body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);font-size:14px;pointer-events:none;padding-inline:16px;text-align:center}
</style>
<div class="stage">
  <canvas id="view" aria-label="金魚の3Dモデル"></canvas>
  <header>
    <h1 id="name">東錦</h1>
    <div class="row" role="group" aria-label="品種">
      <button type="button" data-fish="azumanishiki" aria-pressed="true">東錦</button>
      <button type="button" data-fish="seibun" aria-pressed="false">青文魚</button>
      <button type="button" data-fish="kigashira" aria-pressed="false">黄頭の青白オランダ</button>
    </div>
    <p class="sub" id="note"></p>
    <p class="sub">1本指で回転・2本指で拡大と移動</p>
  </header>
  <div id="status">読み込み中…</div>
  <nav>
    <button type="button" data-v="side">側面</button><button type="button" data-v="front">正面</button>
    <button type="button" data-v="top">上面</button><button type="button" data-v="bottom">下面</button>
    <button type="button" data-v="oblique">斜め</button><button type="button" id="spin" aria-pressed="false">自動回転</button>
  </nav>
</div>
<script>window.FISHES={
 azumanishiki:{name:"東錦",note:"モデル v1：写真4方向を投影。全長12cmの仮スケール",geometry:"models/azumanishiki.json",texture:"models/azumanishiki-1024.jpg"},
 seibun:{name:"青文魚",note:"モデル v2：写真4方向を投影して色を写真に合わせた版",geometry:"models/seibun.json",texture:"models/seibun-1024.jpg"},
 kigashira:{name:"黄頭の青白オランダ",note:"モデル v1：写真4方向を投影。全長12cmの仮スケール",geometry:"models/kigashira.json",texture:"models/kigashira-1024.jpg"}};</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as T from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';
window.THREE = Object.assign({}, T, { OrbitControls });
for (const src of ["fish-json-loader.js", "app.js"]) {
  await new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); });
}
</script>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ヨシキリザメの大水槽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: the tank fills the screen like a plate from a field guide; title top-left, controls float along the bottom
   edge, and the layout editor opens as a sheet above them. Palette follows the muted blue-grey of the supplied illustration. */
:root{
  --paper:#eef2f4; --paper-2:#dde5ea; --ink:#1d2b38; --ink-soft:#56677a; --wash:#3b6f94; --line:#c4d0d8; --sheet:#f8fafb;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0b1822;--paper-2:#122633;--ink:#e3ecf2;--ink-soft:#9eb2c2;--wash:#8cbbdc;--line:#2c4357;--sheet:#14232f;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0b1822;--paper-2:#122633;--ink:#e3ecf2;--ink-soft:#9eb2c2;--wash:#8cbbdc;--line:#2c4357;--sheet:#14232f;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;background:radial-gradient(120% 90% at 50% 45%,var(--paper) 55%,var(--paper-2))}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:grid;gap:2px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,4.6vw,28px);letter-spacing:.06em;margin:0;text-wrap:balance}
.sci{font-style:italic;font-weight:400;font-size:.55em;letter-spacing:.02em;color:var(--ink-soft);margin-left:.6em}
.hint{margin:0;color:var(--ink-soft);font-size:12.5px;line-height:1.6}
body[data-mode="edit"] .hint-view,body[data-mode="view"] .hint-edit{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
button,select{font:500 14px var(--body);color:var(--ink);background:color-mix(in srgb,var(--sheet) 86%,transparent);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button[aria-pressed="true"]{border-color:var(--wash);color:var(--wash);background:color-mix(in srgb,var(--wash) 12%,var(--sheet))}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--wash);outline-offset:2px}
.seg{display:inline-flex;gap:0}
.seg button:first-child{border-radius:999px 0 0 999px}.seg button:last-child{border-radius:0 999px 999px 0;border-left:0}
#edit-panel{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.sheet{pointer-events:auto;width:min(560px,100%);max-height:46vh;overflow:auto;background:color-mix(in srgb,var(--sheet) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > label{font-size:13px;color:var(--ink-soft);min-width:4.5em}
input[type=range]{flex:1;min-width:0;accent-color:var(--wash)}
.note{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.6}
#status{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center}
#status div{display:grid;gap:10px;justify-items:center;max-width:30em}
#status p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.7}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink)}
.bgm{display:inline-flex;align-items:center;gap:6px}
.bgm input{width:80px;accent-color:var(--wash)}
.q{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.q select{min-height:32px;padding:4px 10px;font-size:12px}
</style>
<div id="stage">
  <canvas id="view" aria-label="ヨシキリザメの大水槽：3匹のヨシキリザメと1匹のハチワレが泳ぐ3D水槽"></canvas>
  <header>
    <h1>ヨシキリザメの大水槽<span class="sci">Prionace glauca</span></h1>
    <p class="hint hint-view">ヨシキリザメ3匹とハチワレ1匹が円を描いて泳ぎます。1本指（ドラッグ）で回転、2本指（ホイール）で拡大。</p>
    <p class="hint hint-edit">岩をタップして選び、ドラッグで動かせます。下の欄でも調整できます。</p>
  </header>
  <div id="toast" role="status" hidden></div>
  <div id="edit-panel" hidden>
    <div class="sheet">
      <div class="row"><label for="obj-select">選択</label><select id="obj-select"><option value="">（なし）</option></select></div>
      <div id="obj-controls" hidden style="display:grid;gap:10px">
        <div class="row"><label for="pos-x">左右（cm）</label><input id="pos-x" type="range" min="-600" max="600" step="5"></div>
        <div class="row"><label for="pos-z">前後（cm）</label><input id="pos-z" type="range" min="-300" max="300" step="5"></div>
        <div class="row"><label for="rot-y">向き（度）</label><input id="rot-y" type="range" min="-180" max="180" step="1"></div>
        <div class="row" id="stone-color"><label>この岩の色</label><button type="button" data-color="blue">青系</button><button type="button" data-color="red">赤系</button></div>
      </div>
      <div class="row"><label>岩をすべて</label><button type="button" data-all-color="blue">青系にする</button><button type="button" data-all-color="red">赤系にする</button></div>
      <div class="row"><button type="button" id="reset">デフォルトに戻す</button></div>
      <p class="note">配置と色はこのブラウザに保存され、次に開いたときに続きから表示されます。「デフォルトに戻す」で承認した配置と色に戻ります。</p>
    </div>
  </div>
  <div class="bar">
    <span class="seg"><button type="button" id="mode-view" aria-pressed="true">眺める</button><button type="button" id="mode-edit" aria-pressed="false">配置を変更</button></span>
    <button type="button" data-view="front">正面</button>
    <button type="button" data-view="oblique">斜め</button>
    <button type="button" data-view="top">上から</button>
    <span class="bgm"><button type="button" id="bgm" aria-pressed="false">BGM：オフ</button><input id="bgm-vol" type="range" min="0" max="1" step="0.05" value="0.45" aria-label="BGMの音量"></span>
    <span class="q"><span id="quality-now"></span><select id="quality" aria-label="画質"><option value="auto">画質：自動</option><option value="standard">標準（水面の反射・屈折あり）</option><option value="light">軽量（スマホ向け）</option></select></span>
  </div>
  <div id="status"><div><p>読み込み中…</p><button type="button" hidden>再読み込み</button></div></div>
</div>

4", "kind": "stone", "material": "青灰色の岩", "pos": [430, 0, -225], "size": [190, 110, 140], "rot_deg": -10, "color": "blue"}, {"id": "stone-5", "kind": "stone", "material": "青灰色の岩", "pos": [330, 0, -255], "size": [100, 60, 90], "rot_deg": 45, "color": "blue"}], "assumptions": ["水槽の大きさ 12 m × 6 m × 4.5 m は仮（ユーザー指定なし）", "岩・砂は簡易形状。本制作で素材画像を生成して貼る", "魚は承認済みモデル v1（全長2.6 m）", "v2：ハチワレ1匹を追加（ユーザーの「反映させてください」の指示で、承認済みv1に1匹足した案）。ハチワレは水槽の下寄り（高さ1.5 m）を小さな周回コースで泳ぐ"]}, "models": {"shark-1": {"geometry": "models/blue-shark.json", "standard": "models/blue-shark-2048.jpg", "light": "models/blue-shark-1024.jpg"}, "shark-2": {"geometry": "models/blue-shark.json", "standard": "models/blue-shark-2048.jpg", "light": "models/blue-shark-1024.jpg"}, "shark-3": {"geometry": "models/blue-shark.json", "standard": "models/blue-shark-2048.jpg", "light": "models/blue-shark-1024.jpg"}, "thresher-1": {"geometry": "models/thresher.json", "standard": "models/thresher-2048.jpg", "light": "models/thresher-1024.jpg"}}, "textures": {"background": "textures/background.jpg", "sand": "textures/sand.jpg", "stone-blue": "textures/stone-blue.jpg", "stone-red": "textures/stone-red.jpg"}, "bgm": "audio/bgm.mp3"};</script>

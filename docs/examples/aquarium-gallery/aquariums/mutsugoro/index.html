<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ムツゴロウの干潟水槽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* Layout: the mudflat tank fills the screen; title top-left, controls along the bottom edge (they wrap on phones),
   the layout editor and the watch strip open just above them. Controls follow light / dark tokens. */
:root{
  --sky:#e6e8e6; --sky-2:#f2f1ec;
  --ink:#2a2620; --ink-soft:#5d564b; --accent:#2f6f8f; --line:#cfc8bb; --chip:#f7f4ee; --sheet:#faf8f3;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#ece7dd;--ink-soft:#b9b1a3;--accent:#86c1dc;--line:#4a443b;--chip:#26231f;--sheet:#1f1c19;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#ece7dd;--ink-soft:#b9b1a3;--accent:#86c1dc;--line:#4a443b;--chip:#26231f;--sheet:#1f1c19;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:relative;height:100%;background:linear-gradient(var(--sky-2),var(--sky))}
canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:grid;gap:2px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,4.6vw,28px);letter-spacing:.08em;margin:0;color:#2a2620;text-wrap:balance;text-shadow:0 1px 8px rgba(255,255,255,.7)}
.hint{margin:0;color:#3d372e;font-size:12.5px;line-height:1.6;text-shadow:0 1px 6px rgba(255,255,255,.8)}
body[data-mode="edit"] .hint-view,body[data-mode="view"] .hint-edit{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
button,select{font:500 14px var(--body);color:var(--ink);background:color-mix(in srgb,var(--chip) 86%,transparent);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--chip))}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;gap:0;align-items:center}
.seg button{border-radius:0;border-left-width:0}
.seg button:first-of-type{border-radius:999px 0 0 999px;border-left-width:1px}.seg button:last-of-type{border-radius:0 999px 999px 0}
.seg .lab{font-size:12.5px;color:var(--ink-soft);margin-right:6px;text-shadow:0 1px 6px rgba(255,255,255,.7)}
#edit-panel{position:absolute;left:0;right:0;bottom:calc(var(--bar-h,64px) + 6px);display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.sheet{pointer-events:auto;width:min(560px,100%);max-height:42vh;overflow:auto;background:color-mix(in srgb,var(--sheet) 94%,transparent);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > label{font-size:13px;opacity:.85;min-width:4.5em}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.note{margin:0;font-size:12px;opacity:.8;line-height:1.6}
#watch-strip{position:absolute;left:0;right:0;bottom:calc(var(--bar-h,64px) + 6px);display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding-inline:16px;pointer-events:none}
#watch-strip button{pointer-events:auto}
#status{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center}
#status div{display:grid;gap:10px;justify-items:center;max-width:30em}
#status p{margin:0;color:#3d372e;font-size:14px;line-height:1.7}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink);white-space:nowrap}
.q{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.q select{min-height:32px;padding:4px 10px;font-size:12px}
#watch-select{max-width:11em}
</style>
<div id="stage">
  <canvas id="view" aria-label="ムツゴロウの干潟水槽：有明海の泥干潟を再現した水槽で、4匹のムツゴロウが泥の上を這い、巣穴に出入りし、背鰭を立てて跳ねる3D水槽"></canvas>
  <header>
    <h1>ムツゴロウの干潟水槽</h1>
    <p class="hint hint-view">有明海の干潮の泥干潟。1本指（ドラッグ）で回転、2本指（ホイール）で拡大。ムツゴロウをタップすると観察できます。</p>
    <p class="hint hint-edit">巣穴や水たまりをタップして選び、ドラッグで動かせます。下の欄でも調整できます。</p>
  </header>
  <div id="toast" role="status" hidden></div>
  <div id="edit-panel" hidden>
    <div class="sheet">
      <div class="row"><label for="obj-select">選択</label><select id="obj-select"><option value="">（なし）</option></select></div>
      <div id="obj-controls" hidden style="display:grid;gap:10px">
        <div class="row"><label for="pos-x">左右（cm）</label><input id="pos-x" type="range" min="-40" max="40" step="0.5"></div>
        <div class="row"><label for="pos-z">前後（cm）</label><input id="pos-z" type="range" min="-18" max="18" step="0.5"></div>
      </div>
      <div class="row"><button type="button" id="reset">デフォルトに戻す</button></div>
      <p class="note">配置はこのブラウザに保存され、次に開いたときに続きから表示されます。「デフォルトに戻す」で承認した配置に戻ります。澪筋（水路）の位置は固定です。</p>
    </div>
  </div>
  <div id="watch-strip" hidden>
    <button type="button" id="watch-hold" aria-pressed="false">止める</button>
    <button type="button" id="watch-next">次の魚</button>
    <button type="button" id="watch-all">全体へ</button>
  </div>
  <div class="bar" id="bar">
    <span class="seg"><button type="button" id="mode-view" aria-pressed="true">眺める</button><button type="button" id="mode-edit" aria-pressed="false">配置を変更</button></span>
    <button type="button" data-view="front">正面</button>
    <button type="button" data-view="oblique">斜め</button>
    <button type="button" data-view="top">上から</button>
    <select id="watch-select" aria-label="観察する魚"><option value="">観察：全体を見る</option></select>
    <span class="seg" role="group" aria-label="背鰭"><span class="lab">背鰭</span><button type="button" data-fin="auto" aria-pressed="true">自動</button><button type="button" data-fin="open" aria-pressed="false">立てる</button><button type="button" data-fin="closed" aria-pressed="false">たたむ</button></span>
    <button type="button" id="jump">跳ねる</button>
    <button type="button" id="slow" aria-pressed="false">スロー</button>
    <span class="seg"><button type="button" id="bgm" aria-pressed="false">BGM：オフ</button><input id="bgm-vol" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="BGMの音量" style="width:80px;margin-left:8px"></span>
    <span class="q"><span id="quality-now"></span><select id="quality" aria-label="画質"><option value="auto">画質：自動</option><option value="standard">標準（映り込み）</option><option value="light">軽量（スマホ向け）</option></select></span>
  </div>
  <div id="status"><div><p>読み込み中…</p><button type="button" hidden>再読み込み</button></div></div>
</div>
<script>window.AQUARIUM_ASSETS={"layout": {"version": 3, "units": "cm; tank center at origin, tank floor y=0, front glass +z, left -x. heading_deg: 0 = head toward -x (left), positive turns the head toward the back (-z)", "tank": {"w": 90, "d": 45, "h": 45, "kind": "水陸両方の干潟水槽（奥が泥の陸地、手前が水中。前のガラス越しに水中も見える）", "background": "aquarium/textures/source/background.png（有明海の泥干潟、ユーザー生成）", "mud": "細かい灰褐色の軟泥。奥 14 cm の陸から、中ほどの水際を経て、手前の水底 3 cm へ下る", "water_level": 9.0, "light": "やわらかい昼の光、上やや前から", "mud_profile": {"front_cm": 3, "back_cm": 14, "t0": 0.15, "t1": 0.85}}, "objects": [{"id": "burrow-1", "kind": "burrow", "pos": [-24, 0, -12], "radius": 4.0, "note": "巣穴（入口の水たまりと泥の盛り上がり）"}, {"id": "burrow-2", "kind": "burrow", "pos": [12, 0, -11], "radius": 3.6}, {"id": "burrow-3", "kind": "burrow", "pos": [32, 0, -14], "radius": 3.2}, {"id": "pool-2", "kind": "pool", "pos": [-4, 0, -16], "size": [7, 4.5], "note": "陸の水たまり"}], "fish": [{"id": "mutsu-1", "model": "species/boleophthalmus-pectinirostris/model/v7/mutsugoro.glb", "length_cm": 15, "pos": [2, null, -7], "heading_deg": -20, "air_cm": 13, "pitch_deg": 38, "note": "陸で求愛ジャンプ（背鰭を立て、尾で蹴って跳び上がる）"}, {"id": "mutsu-2", "model": "species/boleophthalmus-pectinirostris/model/v7/mutsugoro.glb", "length_cm": 15, "pos": [-17, null, -13], "heading_deg": 160, "note": "巣穴 burrow-1 の入口で見張る"}, {"id": "mutsu-3", "model": "species/boleophthalmus-pectinirostris/model/v7/mutsugoro.glb", "length_cm": 15, "pos": [-24, null, 12], "heading_deg": -20, "note": "手前の水中を泳ぐ"}, {"id": "mutsu-4", "model": "species/boleophthalmus-pectinirostris/model/v7/mutsugoro.glb", "length_cm": 15, "pos": [20, null, 1], "heading_deg": 160, "note": "水際で体を半分水につけて休む"}], "note": "v2 から、手前を水中にした版（ユーザー指示「水槽の手前側は水中にしてください。水陸両方で観察できる感じで」）。奥が陸の泥干潟、手前が水中。澪筋はなくし、巣穴と水たまりは陸に置く"}, "models": {"species/boleophthalmus-pectinirostris/model/v7/mutsugoro.glb": {"geometry": "models/mutsugoro.json", "standard": "models/mutsugoro-2048.jpg", "light": "models/mutsugoro-1024.jpg"}}, "textures": {"mud": "textures/mud.jpg", "background": "textures/background.jpg"}, "audio": {"bgm": "audio/bgm.mp3"}};</script>

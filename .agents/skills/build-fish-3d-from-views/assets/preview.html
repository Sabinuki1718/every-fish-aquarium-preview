<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D model</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2f4;color:#142638;font:14px system-ui,sans-serif}header{position:absolute;top:20px;left:24px;pointer-events:none}h1{font-size:22px;margin:0 0 6px}p{margin:0;color:#526b7f;max-width:65vw}canvas{display:block;width:100vw;height:100vh;touch-action:none}footer{position:absolute;bottom:16px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}button,select,a{font:inherit;background:white;color:#1b3d5c;padding:8px 12px;border:1px solid #c5d1db;border-radius:7px;text-decoration:none}button,select,a{cursor:pointer}#error{position:absolute;top:40%;left:10%;right:10%;color:#a22}label{display:flex;align-items:center;gap:6px;background:#edf2f4;padding:0 4px}@media(max-width:600px){header{top:16px;left:16px}h1{font-size:18px}footer{bottom:10px}button,select,a{padding:7px 8px}p{max-width:90vw}}</style>
<header><h1 id="title"></h1><p id="description"></p></header><canvas id="canvas"></canvas><div id="error"></div>
<footer><button data-yaw="0" data-pitch="0">側面</button><button data-yaw="1.570796327" data-pitch="0">正面</button><button data-yaw="0" data-pitch="1.570796327">上面</button><button data-yaw="0" data-pitch="-1.570796327">下面</button><button data-yaw="0.65" data-pitch="0.2">斜め</button><label>注目<select id="focus"><option value="-1">全体</option></select></label><button id="spin">自動回転</button><a id="download" download>GLBを保存</a></footer>
<script>
const DATA=__PAYLOAD__;
document.getElementById('title').textContent=DATA.title;document.title=DATA.title;
document.getElementById('description').textContent=DATA.description||'ドラッグで回転 / ホイールで拡大 / 注目でパーツを確認';
document.getElementById('download').href=DATA.glb;
try{
const c=document.getElementById('canvas'),gl=c.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});
if(!gl||!gl.getExtension('OES_element_index_uint'))throw Error('このブラウザでは必要なWebGL機能を利用できません。GLBを対応ビューアで開いてください。');
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const vs=`attribute vec3 p,n;attribute vec2 uv;uniform vec3 target;uniform float scale,yaw,pitch,zoom,aspect,depthScale;varying vec2 v;varying vec3 norm;vec3 rot(vec3 q){float c=cos(yaw),s=sin(yaw);q=vec3(c*q.x+s*q.z,q.y,-s*q.x+c*q.z);c=cos(pitch);s=sin(pitch);return vec3(q.x,c*q.y-s*q.z,s*q.y+c*q.z);}void main(){vec3 q=rot((p-target)*scale);gl_Position=vec4(q.x*zoom/aspect,q.y*zoom,-q.z*depthScale,1.);v=uv;norm=rot(n);}`;
const fs=`precision mediump float;varying vec2 v;varying vec3 norm;uniform sampler2D tex;void main(){vec4 t=texture2D(tex,v);if(t.a<.5)discard;float d=abs(dot(normalize(norm),normalize(vec3(-.35,.65,1.))));gl_FragColor=vec4(t.rgb*(.78+.22*d),1.);}`;
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const loc={};for(const key of ['target','scale','yaw','pitch','zoom','aspect','depthScale'])loc[key]=gl.getUniformLocation(prog,key);
function bounds(parts){const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const m of parts)for(let i=0;i<m.p.length;i++) {const k=i%3;lo[k]=Math.min(lo[k],m.p[i]);hi[k]=Math.max(hi[k],m.p[i]);}const center=lo.map((a,k)=>(a+hi[k])/2);let radius=0;for(const m of parts)for(let i=0;i<m.p.length;i+=3)radius=Math.max(radius,Math.hypot(m.p[i]-center[0],m.p[i+1]-center[1],m.p[i+2]-center[2]));return{center,radius:Math.max(radius,1e-9)};}
const globalBounds=bounds(DATA.parts);let current=globalBounds,yaw=.65,pitch=.2,zoom=.85,spin=false,drag=null,ready=false;
const focus=document.getElementById('focus');DATA.parts.forEach((m,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=m.name;focus.appendChild(o);});focus.onchange=()=>{const i=Number(focus.value);current=i<0?globalBounds:bounds([DATA.parts[i]]);zoom=.85;};
const meshes=DATA.parts.map(m=>{const out={count:m.i.length};for(const key of ['p','n','uv']){out[key]=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,out[key]);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(m[key]),gl.STATIC_DRAW);}out.i=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,out.i);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(m.i),gl.STATIC_DRAW);return out;});
const tex=gl.createTexture(),im=new Image();im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);ready=true;};im.onerror=()=>document.getElementById('error').textContent='埋め込みテクスチャを読み込めませんでした。';im.src=DATA.image;
for(const button of document.querySelectorAll('button[data-yaw]'))button.onclick=()=>{yaw=Number(button.dataset.yaw);pitch=Number(button.dataset.pitch);spin=false;document.getElementById('spin').textContent='自動回転';};
document.getElementById('spin').onclick=e=>{spin=!spin;e.target.textContent=spin?'回転を停止':'自動回転';};
c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId);};c.onpointerup=()=>drag=null;c.onpointercancel=()=>drag=null;c.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch+=(e.clientY-drag[1])*.008;drag=[e.clientX,e.clientY];}};c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.1,Math.min(30,zoom*Math.exp(-e.deltaY*.001)));},{passive:false});
function draw(){const d=Math.min(devicePixelRatio,2),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.clearColor(.929,.949,.957,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(spin)yaw+=.004;if(ready){gl.uniform3fv(loc.target,current.center);const distance=Math.hypot(...globalBounds.center.map((v,i)=>v-current.center[i]));const far=(distance+globalBounds.radius)/current.radius;for(const [key,value]of Object.entries({scale:1/current.radius,yaw,pitch,zoom:zoom*Math.min(1,w/h),aspect:w/h,depthScale:1/(far*2+1)}))gl.uniform1f(loc[key],value);gl.bindTexture(gl.TEXTURE_2D,tex);for(const m of meshes){for(const key of ['p','n','uv']){const a=gl.getAttribLocation(prog,key);gl.bindBuffer(gl.ARRAY_BUFFER,m[key]);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,key==='uv'?2:3,gl.FLOAT,false,0,0);}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,m.i);gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0);}}requestAnimationFrame(draw);}draw();
}catch(error){document.getElementById('error').textContent=String(error.message||error);}
</script></html>
